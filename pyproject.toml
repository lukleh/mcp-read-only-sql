[project]
name = "mcp-read-only-sql"
version = "0.3.1"
description = "MCP server for read-only SQL queries supporting PostgreSQL and ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["sql", "postgresql", "clickhouse", "mcp", "read-only"]
authors = [
    {name = "Lukas Lehner", email = "lehner.lukas@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Floor: mcp.server.fastmcp first shipped in 1.2.0, and FastMCP only emits
    # outputSchema / structured content from 1.10.0 — on older 1.x the server
    # still starts but silently drops the output schemas its tools declare.
    # Cap: 2.0.0 removed mcp.server.fastmcp outright. Keep the cap until the
    # server is ported to the 2.x API.
    "mcp>=1.10.0,<2",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9.0",
    "clickhouse-connect>=0.7.0",
    "paramiko>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/lukleh/mcp-read-only-sql"
Repository = "https://github.com/lukleh/mcp-read-only-sql"
Issues = "https://github.com/lukleh/mcp-read-only-sql/issues"
Changelog = "https://github.com/lukleh/mcp-read-only-sql/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.28",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-read-only-sql = "mcp_read_only_sql.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_read_only_sql"]

[tool.ruff.lint]
# State the rule set explicitly. The dev extra tracks the latest ruff, and
# ruff 0.16 widened its implicit defaults (UP, I, BLE, SIM, DTZ, ...), which
# turned CI red on unchanged code. These four are the set the tree is written
# against; widening it is a deliberate, separate change.
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
include = ["src"]

[tool.vulture]
paths = ["src", "tests"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture"]
ignore_names = ["pytest_*"]
min_confidence = 80
