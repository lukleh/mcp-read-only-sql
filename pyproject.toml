[project]
name = "mcp-read-only-sql"
version = "0.4.0"
description = "MCP server for read-only SQL queries supporting PostgreSQL and ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["sql", "postgresql", "clickhouse", "mcp", "read-only"]
authors = [
    {name = "Lukas Lehner", email = "lehner.lukas@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The server builds on mcp.server.mcpserver (the 2.x successor to FastMCP).
    # Capped below 3 so the next major SDK rewrite cannot silently break installs
    # the way 2.0.0 did when it removed mcp.server.fastmcp.
    "mcp>=2.0.0,<3",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9.0",
    "clickhouse-connect>=0.7.0",
    "paramiko>=3.0.0",
    "pglast>=8,<9",
]

[project.urls]
Homepage = "https://github.com/lukleh/mcp-read-only-sql"
Repository = "https://github.com/lukleh/mcp-read-only-sql"
Issues = "https://github.com/lukleh/mcp-read-only-sql/issues"
Changelog = "https://github.com/lukleh/mcp-read-only-sql/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.2.0",
    # uv.lock is gitignored here, so CI resolves this fresh every run; keep
    # ruff pinned to one minor so a new release cannot change lint behavior
    # under CI silently. Bumping the pin is a deliberate, separate change.
    "ruff>=0.16,<0.17",
    "ty>=0.0.28",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-read-only-sql = "mcp_read_only_sql.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_read_only_sql"]

[tool.ruff.lint]
# Rule set: ruff 0.16's implicit defaults (E4/E7/E9/F plus UP, I, BLE, SIM,
# DTZ, ...). The ruff minor-version pin in the dev extra keeps that implicit
# set deterministic — a new ruff minor cannot silently change lint behavior.
# The opt-outs below are deliberate, not backlog:
ignore = [
    # Broad `except Exception` at the MCP tool boundaries is this server's
    # documented design ("let exceptions propagate; the framework handles
    # them") — the catch-all handlers exist to translate failures into tool
    # results, not to hide bugs.
    "BLE001",
    # The exception types raised to callers are observable API behavior;
    # changing them (e.g. TypeError vs ValueError) is out of scope for a
    # lint pass.
    "TRY004",
]

[tool.ty.src]
include = ["src"]

[tool.vulture]
paths = ["src", "tests"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture"]
ignore_names = ["pytest_*"]
min_confidence = 80
